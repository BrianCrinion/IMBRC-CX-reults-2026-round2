<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMBRC CX Round 1 &mdash; Timing Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0D1210;
    --panel:#141B18;
    --line:#2A342F;
    --amber:#FFB020;
    --green:#3FE07A;
    --dim:#7C8A82;
    --text:#E7ECE8;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    padding:0 0 60px;
  }
  .mono{font-family:'Space Mono',monospace;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px;}

  header{
    padding:32px 0 20px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    border-bottom:1px solid var(--line);
    margin-bottom:24px;
    flex-wrap:wrap;
    gap:10px;
  }
  .title-block h1{
    margin:0;
    font-size:26px;
    font-weight:600;
    letter-spacing:0.01em;
  }
  .title-block .sub{
    color:var(--dim);
    font-size:13px;
    margin-top:4px;
  }
  .clock{
    font-family:'Space Mono',monospace;
    font-size:13px;
    color:var(--green);
    text-align:right;
  }
  .clock .label{color:var(--dim);font-size:11px;display:block;margin-bottom:2px;}

  .board{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:1px;
    background:var(--line);
    border:1px solid var(--line);
    margin-bottom:28px;
  }
  .cell{
    background:var(--panel);
    padding:8px 14px;
  }
  .cell .toprow{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:8px;
  }
  .cell .rank{
    font-family:'Space Mono',monospace;
    font-size:10px;
    color:var(--amber);
    letter-spacing:0.05em;
    white-space:nowrap;
  }
  .cell .name{
    font-size:14px;
    font-weight:600;
    margin:1px 0 0;
  }
  .cell .club{
    font-size:11px;
    color:var(--dim);
    margin-bottom:2px;
  }
  .cell .bottomrow{
    display:flex;
    align-items:baseline;
    gap:8px;
  }
  .cell .time{
    font-family:'Space Mono',monospace;
    font-size:15px;
    color:var(--green);
    letter-spacing:0.02em;
  }
  .cell .gap{
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--dim);
  }

  .controls{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    gap:10px;
    flex-wrap:wrap;
  }
  .controls input{
    font-family:'Space Mono',monospace;
    background:var(--panel);
    border:1px solid var(--line);
    color:var(--text);
    padding:8px 12px;
    font-size:13px;
    min-width:200px;
  }
  .controls input::placeholder{color:var(--dim);}
  .controls .hint{font-size:11px;color:var(--dim);font-family:'Space Mono',monospace;}

  .table-scroll{
    width:100%;
    overflow-x:auto;
    border:1px solid var(--line);
  }
  table{
    width:100%;
    min-width:940px;
    border-collapse:collapse;
    font-size:13px;
  }
  thead th{
    text-align:left;
    font-family:'Space Mono',monospace;
    font-size:11px;
    color:var(--dim);
    text-transform:uppercase;
    letter-spacing:0.04em;
    border-bottom:1px solid var(--line);
    padding:8px 10px;
    cursor:pointer;
    user-select:none;
    white-space:nowrap;
  }
  thead th:hover{color:var(--amber);}
  thead th.num, td.num{text-align:right;}
  tbody td{
    padding:7px 10px;
    border-bottom:1px solid var(--line);
    font-family:'Space Mono',monospace;
    font-variant-numeric:tabular-nums;
    white-space:nowrap;
  }
  tbody tr:hover{background:var(--panel);}
  td.name{font-family:'Inter',sans-serif;font-weight:500;white-space:normal;}
  td.club{font-family:'Inter',sans-serif;color:var(--dim);font-size:12px;white-space:normal;}
  .row-podium td{color:var(--green);}
  .lap-sep td{border-top:1px solid var(--amber);}
  .badge{
    display:inline-block;
    font-size:10.5px;
    padding:1px 6px;
    border:1px solid var(--dim);
    color:var(--dim);
  }
  footer{
    margin-top:32px;
    font-size:11px;
    color:var(--dim);
    font-family:'Space Mono',monospace;
    border-top:1px solid var(--line);
    padding-top:14px;
  }
  @media(max-width:700px){
    .board{grid-template-columns:1fr;}
    td.club{display:none;}
    thead th:nth-child(4){display:none;}
  }
</style>
</head>

  </table>
  </div>

</div>

function timeToSeconds(t){
  if(!t || t==="-") return null;
  const parts = t.split(":").map(Number);
  if(parts.length===2) return parts[0]*60+parts[1];
  return null;
}

function renderPodium(){
  const podium = document.getElementById('podium');
  const top3 = DATA.slice(0,3);
  document.getElementById('winnerTime').textContent = top3[0].race;
  podium.innerHTML = top3.map((r,i)=>`
    <div class="cell">
      <div class="rank">${i===0?'1ST &mdash; WINNER':(i===1?'2ND':'3RD')}</div>
      <div class="name">${r.name}</div>
      <div class="club">${r.club||'&mdash;'}</div>
      <div class="time">${r.race}</div>
      <div class="gap">${r.gap==='-'?'leader':(r.gap.includes('LAP')?r.gap:'+'+r.gap.replace('+',''))}</div>
    </div>
  `).join('');
}

const WOMEN_RANKED = DATA.filter(r => r.sex === 'F').slice().sort((a,b)=>Number(a.pos)-Number(b.pos));
const WOMEN_TOP3 = WOMEN_RANKED.slice(0,3).map(r => r.name);

function renderPodiumWomen(){
  const podium = document.getElementById('podiumWomen');
  if(!podium) return;
  const rows = WOMEN_RANKED.slice(0,3);
  podium.innerHTML = rows.map((r,i)=>`
    <div class="cell">
      <div class="rank">${i===0?'1ST WOMAN':(i===1?'2ND WOMAN':'3RD WOMAN')} &middot; POS ${r.pos}</div>
      <div class="name">${r.name}</div>
      <div class="club">${r.club||'&mdash;'}</div>
      <div class="time">${r.race}</div>
      <div class="gap">${r.gap==='-'?'leader':(r.gap.includes('LAP')?r.gap:'+'+r.gap.replace('+',''))}</div>
    </div>
  `).join('');
}

let sortKey = 'pos', sortAsc = true, filterText = '';

function renderTable(){
  const tbody = document.querySelector('#resultsTable tbody');
  let rows = DATA.filter(r =>
    r.name.toLowerCase().includes(filterText) || (r.club||'').toLowerCase().includes(filterText)
  );

  rows = rows.slice().sort((a,b)=>{
    let av=a[sortKey], bv=b[sortKey];
    if(sortKey==='race' || sortKey==='fastest'){
      av = timeToSeconds(av); bv = timeToSeconds(bv);
      av = av===null? Infinity: av; bv = bv===null? Infinity: bv;
    } else if(typeof av === 'string' && !isNaN(parseFloat(av)) && sortKey!=='name' && sortKey!=='club' && sortKey!=='gap'){
      av = parseFloat(av); bv = parseFloat(bv);
    }
    if(av<bv) return sortAsc? -1:1;
    if(av>bv) return sortAsc? 1:-1;
    return 0;
  });

  let lastLaps = null;
  tbody.innerHTML = rows.map(r=>{
    const sep = (sortKey==='pos' && lastLaps!==null && r.laps!==lastLaps) ? ' lap-sep':'';
    lastLaps = r.laps;
    const podiumClass = (sortKey==='pos' && Number(r.pos)<=3) ? ' row-podium':'';
    const womanIdx = WOMEN_TOP3.indexOf(r.name);
    const womanBadge = womanIdx>-1 ? ` <span class="badge">W${womanIdx+1}</span>` : '';
    return `<tr class="${sep}${podiumClass}">
      <td class="pos num">${r.pos}</td>
      <td class="num">${r.bib}</td>
      <td class="name">${r.name}${womanBadge}</td>
      <td class="club">${r.club||''}</td>
      <td class="num">${r.laps}</td>
      <td class="num">${r.l1||''}</td>
      <td class="num">${r.l2||''}</td>
      <td class="num">${r.l3||''}</td>
      <td class="num">${r.l4||''}</td>
      <td class="num">${r.l5||''}</td>
      <td class="num">${r.race}</td>
      <td class="num">${r.laps < DATA[0].laps ? '<span class="badge">'+r.gap+'</span>' : r.gap}</td>
      <td class="num">${r.fastest||''}</td>
    </tr>`;
  }).join('');
}

document.querySelectorAll('#resultsTable thead th').forEach(th=>{
  th.addEventListener('click', ()=>{
    const key = th.dataset.key;
    if(sortKey===key) sortAsc = !sortAsc; else { sortKey = key; sortAsc = true; }
    renderTable();
  });
});

document.getElementById('search').addEventListener('input', (e)=>{
  filterText = e.target.value.toLowerCase();
  renderTable();
});

renderPodium();
renderPodiumWomen();
renderTable();
</script>
